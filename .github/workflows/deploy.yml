# main에 푸시될 때마다 정적 빌드를 만들어 GitHub Pages에 배포한다.
#
# 처음 한 번 직접 할 일:
#   1. 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정
#   2. Settings → Secrets and variables → Actions → Variables 탭에서 저장소 변수 두 개를 만든다.
#      VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (anon 키는 공개값이다. service_role 키는 절대 넣지 않는다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
